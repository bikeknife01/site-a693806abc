<!doctype html>
<html lang="en">
<head>

  <meta name="theme-color" content="#101722">

  <a class="skip-link" href="#content">Skip to content</a>

    <nav class="sidebar" aria-label="Encyclopedia sections">
      <a href="#/dragons" data-nav="dragons"><span aria-hidden="true">◇</span> Dragons</a>

    <main id="content" tabindex="-1">
      <div class="loading" role="status">Loading normalized records…</div>

  <script src="./app.js" defer></script>
